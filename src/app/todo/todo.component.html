<!-- src/app/todo/todo.component.html -->
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h2 class="text-center mb-0">To-Do List</h2>
        </div>
        <div class="card-body">
            <div class="input-group mb-3">
                <input
                    type="text"
                    class="form-control"
                    placeholder="Add a new task"
                    [(ngModel)]="newTask"
                />
                <button class="btn btn-success" (click)="addTask()">
                    <i class="bi bi-plus-circle"></i> Add
                </button>
            </div>
            <ul class="list-group" *ngIf="tasks.length > 0; else emptyState">
                <li
                    *ngFor="let task of tasks; let i = index"
                    class="list-group-item d-flex justify-content-between align-items-center"
                >
                    <div class="d-flex align-items-center">
                        <input
                            type="checkbox"
                            class="form-check-input me-2"
                            [(ngModel)]="task.completed"
                            (change)="toggleTask(i)"
                        />
                        <span
                            *ngIf="!task.isEditing"
                            [class.text-decoration-line-through]="task.completed"
                        >
                            {{ task.name }}
                        </span>
                        <input
                            *ngIf="task.isEditing"
                            type="text"
                            class="form-control form-control-sm"
                            [(ngModel)]="task.name"
                            (blur)="saveTask(i)"
                            (keyup.enter)="saveTask(i)"
                        />
                    </div>
                    <div class="btn-group">
                        <button
                            *ngIf="!task.isEditing"
                            class="btn btn-primary btn-sm me-2"
                            (click)="editTask(i)"
                        >
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button
                            *ngIf="task.isEditing"
                            class="btn btn-success btn-sm me-2"
                            (click)="saveTask(i)"
                        >
                            <i class="bi bi-check-circle"></i>
                        </button>
                        <button class="btn btn-danger btn-sm" (click)="deleteTask(i)">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </li>
            </ul>
            <ng-template #emptyState>
                <div class="text-center text-muted mt-3">
                  <i class="bi bi-emoji-frown" style="font-size: 2rem;"></i>
                  <p>No tasks available. Add a new task to get started!</p>
                </div>
              </ng-template>
        </div>
    </div>
</div>
